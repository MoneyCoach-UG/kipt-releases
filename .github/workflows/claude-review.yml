name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts and PRs from forks (forks get no secrets).
    if: >-
      github.event.pull_request.draft != true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. If the repository has a CLAUDE.md or
            AGENTS.md, follow its review rules and invariants.

            - Read the full diff with `gh pr diff` and the relevant callers before you report.
            - Report only actionable bugs with a concrete scenario and impact. No style nits.
            - Post each finding as an inline comment with
              mcp__github_inline_comment__create_inline_comment.
            - Post one short summary comment with `gh pr comment`. If there are no
              findings, say so in one line.
          claude_args: >-
            --model sonnet
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
